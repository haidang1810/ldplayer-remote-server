<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e15">
  <title>Điều khiển · LD Remote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='6' y='2' width='12' height='20' rx='2.5' fill='%236366f1'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LD Remote">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="vbar">
    <a class="btn ghost icon" href="./" title="Về bảng điều khiển" aria-label="Về bảng điều khiển"><i data-icon="chevronLeft"></i></a>
    <button id="dev-switch" class="dev-switch" type="button" aria-haspopup="menu" title="Đổi máy">
      <span class="dev-ico"><i data-icon="phone"></i></span>
      <span class="dev-text"><b id="dev-name">Đang tải…</b><small id="dev-sub"></small></span>
      <i data-icon="chevronDown"></i>
    </button>
    <span id="status" class="vstatus" data-state="idle">Chưa kết nối</span>
    <span class="spacer"></span>
    <span id="stats" class="stats"></span>
    <button id="btn-stats" class="btn ghost icon desk" type="button" title="Hiện/ẩn thông số kết nối" aria-label="Thông số kết nối" aria-pressed="false"><i data-icon="stats"></i></button>
    <button id="btn-panel" class="btn ghost icon desk" type="button" title="Danh sách máy" aria-label="Hiện/ẩn danh sách máy" aria-pressed="true"><i data-icon="layers"></i></button>
    <button id="btn-more-top" class="btn ghost icon" type="button" title="Thêm" aria-label="Thêm tuỳ chọn" aria-haspopup="menu"><i data-icon="more"></i></button>
  </header>

  <div class="vbody">
    <aside id="switcher" class="switcher" aria-label="Danh sách máy">
      <div class="switcher-head">
        <b>Điện thoại</b>
        <span id="switcher-count" class="muted"></span>
      </div>
      <label class="input-icon"><i data-icon="search"></i>
        <input id="switcher-search" class="input" type="search" placeholder="Tìm máy…" aria-label="Tìm máy">
      </label>
      <div id="switcher-list" class="switcher-list"></div>
    </aside>

    <main id="stage">
      <div id="surface">
        <canvas id="screen"></canvas>
        <video id="video" muted autoplay playsinline disablepictureinpicture hidden></video>
      </div>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="spinner" id="overlay-spinner"></div>
          <div id="overlay-text">Đang tải…</div>
          <div id="overlay-actions" class="overlay-actions"></div>
        </div>
      </div>
      <textarea id="ime" class="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Bàn phím"></textarea>
    </main>

    <!-- Desktop toolbar -->
    <nav class="vtools keep-focus" id="nav" aria-label="Điều khiển máy">
      <button class="tool" type="button" data-key="4" title="Quay lại" aria-label="Quay lại"><i data-icon="back"></i></button>
      <button class="tool" type="button" data-key="3" title="Màn hình chính" aria-label="Màn hình chính"><i data-icon="home"></i></button>
      <button class="tool" type="button" data-key="187" title="Ứng dụng gần đây" aria-label="Ứng dụng gần đây"><i data-icon="recent"></i></button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" data-key="24" title="Tăng âm lượng" aria-label="Tăng âm lượng"><i data-icon="volUp"></i></button>
      <button class="tool" type="button" data-key="25" title="Giảm âm lượng" aria-label="Giảm âm lượng"><i data-icon="volDown"></i></button>
      <button class="tool" type="button" id="btn-rotate" title="Xoay màn hình" aria-label="Xoay màn hình"><i data-icon="rotate"></i></button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="btn-keyboard" title="Bàn phím" aria-label="Bàn phím"><i data-icon="keyboard"></i></button>
      <button class="tool text" type="button" id="btn-keymode" title="Chế độ bàn phím: Văn bản gửi ký tự (có tiếng Việt), Phím game gửi mã phím thô">Văn bản</button>
      <button class="tool" type="button" id="btn-notify" title="Thanh thông báo" aria-label="Thanh thông báo"><i data-icon="bell"></i></button>
      <button class="tool" type="button" id="btn-clipboard" title="Clipboard" aria-label="Clipboard"><i data-icon="clipboard"></i></button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="btn-apk" title="Cài APK" aria-label="Cài APK"><i data-icon="apk"></i></button>
      <button class="tool" type="button" id="btn-apps" title="Ứng dụng đã cài" aria-label="Ứng dụng đã cài"><i data-icon="apps"></i></button>
      <button class="tool" type="button" id="btn-shot" title="Chụp màn hình" aria-label="Chụp màn hình"><i data-icon="camera"></i></button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="btn-fullscreen" title="Toàn màn hình" aria-label="Toàn màn hình"><i data-icon="fullscreen"></i></button>
      <button class="tool" type="button" id="btn-power" title="Nguồn và chất lượng" aria-label="Nguồn và chất lượng" aria-haspopup="menu"><i data-icon="settings"></i></button>
    </nav>
  </div>

  <!-- Mobile bottom controls -->
  <nav class="vnav keep-focus" aria-label="Điều khiển máy">
    <button type="button" data-key="4" aria-label="Quay lại"><i data-icon="back"></i></button>
    <button type="button" data-key="3" aria-label="Màn hình chính"><i data-icon="home"></i></button>
    <button type="button" data-key="187" aria-label="Ứng dụng gần đây"><i data-icon="recent"></i></button>
    <button type="button" id="m-keyboard" aria-label="Bàn phím"><i data-icon="keyboard"></i></button>
    <button type="button" id="m-more" aria-label="Thêm điều khiển" aria-haspopup="menu"><i data-icon="more"></i></button>
  </nav>

  <!-- Shown only in full-screen mode, where the bars are hidden. -->
  <div id="float-bar" class="float-bar keep-focus">
    <button id="float-back" type="button" title="Quay lại" aria-label="Quay lại"><i data-icon="back"></i></button>
    <button id="float-exit" type="button" title="Thoát toàn màn hình" aria-label="Thoát toàn màn hình"><i data-icon="exitFullscreen"></i></button>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
