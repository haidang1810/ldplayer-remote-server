<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>LDPlayer Remote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='6' y='2' width='12' height='20' rx='2.5' fill='%2334d399'/%3E%3C/svg%3E">
  <!-- Home-screen app: runs without browser chrome (iOS ignores the Fullscreen API on iPhone). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LD Remote">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <select id="device" aria-label="Chọn máy ảo"></select>
    <span id="status" class="status" data-state="idle">Chưa kết nối</span>
    <span class="spacer"></span>
    <span id="stats" class="stats"></span>
    <button id="btn-fullscreen" class="icon-btn" title="Toàn màn hình" aria-label="Toàn màn hình">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="btn-logout" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
    </button>
  </header>

  <main id="stage">
    <div id="surface">
      <canvas id="screen"></canvas>
      <video id="video" muted autoplay playsinline disablepictureinpicture hidden></video>
    </div>
    <div id="overlay" class="overlay">
      <div id="overlay-text">Đang tải…</div>
      <form id="login-form" class="login-form" hidden>
        <input id="password-input" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        <button type="submit">Đăng nhập</button>
      </form>
    </div>
    <textarea id="ime" class="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Bàn phím"></textarea>
  </main>

  <nav class="nav" id="nav">
    <button data-key="25" title="Giảm âm lượng" aria-label="Giảm âm lượng"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4"/></svg></button>
    <button data-key="24" title="Tăng âm lượng" aria-label="Tăng âm lượng"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4M19 10v4"/></svg></button>
    <span class="nav-sep"></span>
    <button data-key="4" title="Quay lại" aria-label="Quay lại" class="main"><svg viewBox="0 0 24 24"><path d="M16 5 7 12l9 7z"/></svg></button>
    <button data-key="3" title="Màn hình chính" aria-label="Màn hình chính" class="main"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
    <button data-key="187" title="Ứng dụng gần đây" aria-label="Ứng dụng gần đây" class="main"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <span class="nav-sep"></span>
    <button id="btn-keyboard" title="Bàn phím (điện thoại)" aria-label="Bàn phím"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <button id="btn-keymode" class="text-btn" title="Chế độ bàn phím: Văn bản gửi ký tự, Phím gửi mã phím thô (cho game)">Văn bản</button>
    <button id="btn-notify" title="Thanh thông báo" aria-label="Thanh thông báo"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
  </nav>

  <!-- Shown only in full-screen mode, where the top and bottom bars are hidden. -->
  <div id="float-bar" class="float-bar">
    <button id="float-back" title="Quay lại" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M16 5 7 12l9 7z"/></svg></button>
    <button id="float-exit" title="Thoát toàn màn hình" aria-label="Thoát toàn màn hình"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
