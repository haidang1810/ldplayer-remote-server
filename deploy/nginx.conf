# nginx site for the relay. install.sh fills in __DOMAIN__ / __PORT__, then either certbot's nginx
# plugin adds HTTPS to this file, or (without the plugin) install.sh swaps in nginx-ssl.conf.
map $http_upgrade $ldr_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME http-01 challenges for certbot --webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # WebSocket upgrade for /ws (viewers) and /agent (the PC agent).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ldr_connection_upgrade;

        # The relay checks Origin against Host, and rate-limits logins by client IP:
        # overwrite X-Forwarded-For so clients cannot spoof it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live video: no buffering, and long-lived sockets (the relay pings every 15 s).
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 2g;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
