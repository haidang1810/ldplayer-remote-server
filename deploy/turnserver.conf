# coturn for LDPlayer Remote (written by install.sh; __PLACEHOLDERS__ are filled in).
# Relays WebRTC media when the PC and the viewer cannot connect peer-to-peer (common on 4G).
listening-port=__TURN_PORT__
__EXTERNAL_IP__
realm=__DOMAIN__
server-name=__DOMAIN__

# Short-lived credentials minted by the relay from this shared secret (no static users).
use-auth-secret
static-auth-secret=__TURN_SECRET__
fingerprint

# UDP ports handed out for relayed media; open them (UDP) in the firewall with 3478 tcp/udp.
min-port=__MIN_PORT__
max-port=__MAX_PORT__

# Media is UDP; never let the server be used as a TCP proxy or to reach private networks.
no-tcp-relay
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=60

no-tls
no-dtls
no-cli
log-file=syslog
simple-log
